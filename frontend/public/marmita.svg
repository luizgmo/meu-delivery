<path d="M380 220q18-37 48-17 30-5 27 21-5 29-37 26-28-2-38-30Z"/>
</g>
<g stroke="#a8b96d" stroke-width="3" stroke-linecap="round"><path d="M317 125l53 25M376 172l56 12M317 211l42-17M400 229l31-8"/></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" fill="none">
<title>Marmita ilustrada com arroz, feijão, legumes e salada</title>
<defs>
  <pattern id="rice" width="25" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)"><rect width="25" height="22" fill="#f8eed3"/><path d="M4 4l8 3M16 15l6-3" stroke="#e2cda0" stroke-width="3.5" stroke-linecap="round"/></pattern>
  <pattern id="beans" width="36" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><rect width="36" height="30" fill="#8b4931"/><ellipse cx="12" cy="10" rx="9" ry="6" fill="#b66e46"/><path d="M8 9l6 1" stroke="#d5905c" stroke-width="2" stroke-linecap="round"/><ellipse cx="29" cy="25" rx="9" ry="6" fill="#6f382a"/></pattern>
  <linearGradient id="tray" x1="70" y1="80" x2="490" y2="490" gradientUnits="userSpaceOnUse"><stop stop-color="#fdfbf3"/><stop offset="1" stop-color="#d4c4a5"/></linearGradient>
</defs>
<!-- Ilustração vetorial original, sem fotografias ou recursos externos. -->
<rect x="69" y="84" width="424" height="406" rx="80" fill="#9d7952" opacity=".13"/>
<rect x="65" y="69" width="430" height="418" rx="79" fill="url(#tray)" stroke="#fffdf3" stroke-width="5"/>
<rect x="83" y="87" width="394" height="382" rx="63" fill="#bba98a"/>

<g fill="#edaa64"><ellipse cx="409" cy="128" rx="4" ry="6" transform="rotate(-35 409 128)"/><ellipse cx="424" cy="138" rx="4" ry="6" transform="rotate(-35 424 138)"/><ellipse cx="350" cy="219" rx="4" ry="5"/><ellipse cx="363" cy="232" rx="4" ry="5"/></g>
<!-- Legumes assados -->
<path d="M298 279H458V403Q458 452 408 452H298Z" fill="#c49d5f"/>
<g fill="#d98a3f" stroke="#a85d2e" stroke-width="3"><rect x="319" y="295" width="46" height="120" rx="20" transform="rotate(-15 319 295)"/><rect x="377" y="299" width="44" height="126" rx="20" transform="rotate(12 377 299)"/></g>
